# Every push and pull request: the full test suite, then the scoring container
# built and exercised over HTTP. Neither job needs the LendingClub extract -
# the tests are synthetic and the container loads the committed champion -
# which is what makes them runnable here at all.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The default torch wheel on Linux bundles CUDA, several gigabytes the
      # tests never touch. Installing the CPU build first satisfies the pin in
      # requirements.txt without them.
      - name: Install CPU-only torch
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build the scoring image
        run: docker build -t credit-risk-scoring .

      - name: Start the service
        run: docker run -d --name scoring -p 8000:8000 credit-risk-scoring

      - name: Wait for it to report healthy
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs scoring
          exit 1

      - name: Score the example application
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/score \
            -H "Content-Type: application/json" \
            --data @examples/application.json | tee response.json
          python3 -c "import json; body = json.load(open('response.json')); assert 0 < body['probability_of_default'] < 1; assert len(body['reasons']) <= 4"

      - name: Refuse an application with a missing required field
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/score \
            -H "Content-Type: application/json" --data '{}')
          test "$status" = "422"

      - name: Service logs
        if: always()
        run: docker logs scoring
