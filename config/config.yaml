# Single source of truth. Nothing that affects a number lives outside this file.

data:
  raw_path: data/raw/accepted_2007_to_2018Q4.csv
  interim_path: data/interim/modelling_base.parquet
  status_column: loan_status
  date_column: issue_d
  # Rows per chunk on the full-file pass. Bounds peak memory; does not affect
  # any reported figure.
  chunksize: 200000
  # The extract is sixteen concatenated exports, each of which kept its own
  # two-line "Total amount funded in policy code N" footer, plus one
  # "Loans that do not meet the credit policy" divider. Measured: 33 such
  # lines. They are detected by an unparsable id and dropped. The ceiling
  # leaves headroom over that measurement; anything above it means parsing has
  # gone wrong and must stop rather than silently shrink the population.
  max_unparsable_rows: 100

target:
  # Resolved outcomes only. Unresolved loans are neither good nor bad and are
  # excluded rather than silently counted as good.
  bad_statuses:
    - Charged Off
    - Default
  good_statuses:
    - Fully Paid
  # Named rather than inferred. A status in none of these three lists raises,
  # because an unrecognised outcome must be a decision, not a silent exclusion.
  # "Issued" is listed in D1 and does not occur in this extract; it stays so
  # the configuration matches the documented decision.
  unresolved_statuses:
    - Current
    - Issued
    - In Grace Period
    - Late (16-30 days)
    - Late (31-120 days)
  # Historic "Does not meet the credit policy" loans are a different population.
  include_policy_failures: false

profile:
  # Distinct values are counted exactly up to this ceiling, then reported as a
  # floor (">= n"). url holds one distinct value per loan and emp_title
  # hundreds of thousands; counting those exactly would cost more memory than
  # the load this module exists to bound.
  max_distinct_tracked: 10000
  report_path: reports/01_profile.md
  column_csv_path: reports/column_profile.csv
  figure_path: reports/figures/01_volume_by_quarter.png

leakage:
  # D2, the whitelist. Hand-maintained and never written by any script, so a
  # rerun cannot destroy the labelling. `availability` records whether the
  # value existed when the application was decided; `role` records what the
  # column is allowed to be used for. The two are separate on purpose: zip_code
  # is available and still excluded, for reasons that are legal rather than
  # temporal.
  audit_path: config/column_availability.csv

challenger:
  # The last months of the training window become the early-stopping set. The
  # holdout must not influence the fit at all, and choosing the number of trees
  # against it would do exactly that.
  validation_months: 6
  learning_rate: 0.05
  num_leaves: 31
  # Large, because a million rows can support leaves that are still stable.
  min_child_samples: 200
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  # An upper bound; early stopping picks the actual number.
  n_estimators: 2000
  early_stopping_rounds: 50
  # LightGBM is not reproducible across thread counts without this.
  deterministic: true

explain:
  # SHAP is exact but costs a pass over every tree for every row. The holdout
  # is sampled rather than explained whole, and the sample size is reported so
  # no figure derived from it is mistaken for a population number.
  sample_rows: 20000
  top_features: 20

split:
  # Out-of-time. Chosen from the quarterly table in reports/01_profile.md:
  # no calendar year lands in the 20-25% band D3 asks for (2017 onward is
  # 16.8%, 2016 onward is 38.6%), so the cutoff sits inside 2016. 2016Q4 puts
  # 282,970 resolved loans in the holdout, 21.0% of the population.
  cutoff_date: 2016-10-01
  min_train_months: 24

woe:
  # Fine quantile bins to start from, before merging. Higher gives the merge
  # more freedom; it does not change the result once the merge rules bite.
  pre_bins: 20
  max_bins: 10
  # Every numeric bin must hold at least this share of the fitting rows, so a
  # cut-point is never drawn from a handful of observations.
  min_bin_fraction: 0.05
  # Categories are discrete and meaningful, so they need far less mass than a
  # numeric cut-point. At 0.05 the 51 states of addr_state would nearly all
  # merge away.
  min_category_fraction: 0.01
  # Merge adjacent bins until WOE is monotone. A non-monotone risk ordering is
  # usually a sampling artefact and cannot be defended to a reviewer.
  enforce_monotonic: true
  # Below this a feature carries nothing and is dropped.
  min_iv: 0.02
  # Above this a feature is reported as suspicious, not dropped. Conventionally
  # IV > 0.5 is "too good"; after a leakage audit it is a signal the audit
  # missed something rather than a cause for celebration.
  suspicious_iv: 0.5

model:
  random_state: 42
  # Pairwise correlation ceiling on WOE columns. Above it the higher-IV feature
  # is kept and the other dropped: collinear inputs make scorecard coefficients
  # unstable and sometimes wrong-signed, which destroys the one property the
  # champion exists for.
  max_correlation: 0.75
  max_iter: 200
  scorecard:
    # Standard points scaling. A score of base_score corresponds to base_odds
    # good-to-bad, and every pdo points doubles the odds.
    base_score: 600
    base_odds: 50
    pdo: 20