# D8: the retrieval evaluation set. Hand-written, hand-maintained, never
# generated.
#
# Each entry pairs a question with the section that answers it. Retrieval is
# scored on whether that *section* came back, not on whether plausible text
# did, which is why every entry carries a citation rather than a passage.
#
# `evidence` is a phrase that must appear in the cited section. It is checked
# by the test suite. Without it a question could quietly point at the wrong
# section and every number computed from this file would be wrong in a way
# nothing would reveal - the Layer 2 version of the reconciliation D1 does on
# its row counts.
#
# `kind` splits the set in two, and the split is the point:
#
#   lexical     the question uses the terms of art the section uses. A keyword
#               index should do well; if it does not, something is broken.
#   paraphrase  the question asks the same thing in the words a person would
#               actually use, sharing little or no vocabulary with the text.
#               This is where a keyword index is expected to struggle and an
#               embedding is expected to earn its place.
#
# Writing only lexical questions would make BM25 win by construction and the
# comparison in D7 would measure nothing. The balance is deliberate and the
# report breaks the scores down by kind.

questions:
  # --- Regulation B: notification and adverse action -----------------------
  - id: q01
    question: What must a creditor include in an adverse action notice?
    citations: ["12 CFR 1002.9"]
    kind: lexical
    evidence: "statement of specific reasons"

  - id: q02
    question: How long does a lender have to tell someone whether their loan was approved?
    citations: ["12 CFR 1002.9"]
    kind: paraphrase
    evidence: "30 days after receiving a completed application"

  - id: q03
    question: If an application is incomplete, what are the creditor's options?
    citations: ["12 CFR 1002.9"]
    kind: paraphrase
    evidence: "incomplete application"

  - id: q04
